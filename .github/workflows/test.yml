name: Offline workflow checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODEL_CALLS_ENABLED: 'true'
      WORKER_ENABLED: 'true'
      PUBLIC_PUBLISH_MODE: checkout
      PREVIEW_PORT: '4198'
      PREVIEW_ORIGIN: http://localhost:4198
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test --test-force-exit --test-concurrency=1 test/*.test.js
